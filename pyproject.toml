[project]
name = "jackett-search-bot"
version = "0.1.0"
description = "Telegram bot for searching Jackett releases with in-chat pagination."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyrogram",
    "python-dotenv",
    "httpx",
    "rich",
    "tgcrypto; python_version < '3.13'",
    "qbittorrent-api>=2026.5.1",
    "aiohttp>=3.13.5",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jackett_bot*"]
